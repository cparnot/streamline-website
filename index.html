<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamline</title>
<link rel="icon" href="logo.png">
<style>
  html, body { margin: 0; min-height: 100%; background: #fff; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 5vh 5vw 60px;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #333;
  }
  img {
    width: min(300px, 50vw);
    height: auto;
  }
  .tagline {
    margin: 32px 0 0;
    font-size: 1.3rem;
    font-weight: 500;
  }
  .soon {
    margin: 12px 0 0;
    font-size: 1rem;
    color: #888;
  }
  footer {
    position: fixed;
    bottom: 12px;
    left: 0;
    width: 100%;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
  <img src="logo.png" alt="Streamline">
  <p class="tagline">Software development &amp; technical advice</p>
  <p class="soon">Apps coming soon...</p>
  <footer>Sorry no cookies for you</footer>
</body>
</html>
